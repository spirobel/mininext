name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      # library, frontend, site and tests
      - name: typecheck
        run: bun run typecheck

      - name: build
        run: bun run build

      # tests/functional, tests/quality_assurance (injection + no backend code in browser
      # bundles) and tests/performance (leaks, dom write counts, scaling) in bun + jsdom
      - name: tests
        run: bun run test

  # real chrome over cdp: the jsdom suites again in chrome (with the scaling timings),
  # bun --hot edits, and stress + memory + idle layout.
  # the ubuntu runner already has google-chrome.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: browser tests
        run: CHROME="$(command -v google-chrome)" STRESS_SECONDS=8 bun run test:browser
